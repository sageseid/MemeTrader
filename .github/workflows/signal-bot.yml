name: signal-bot

on:
  # Hourly runs come from cron-job.org calling workflow_dispatch at :17 past each hour.
  # GitHub's own `schedule:` trigger was dropped: it skipped almost every hour on this repo.
  push:
    branches: [main]
    paths: [data/positions.csv]   # run right away when you add a position, so its snapshot is taken at entry
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        options: [run, test-email, check-keys, scorecard, dry-run]
        default: run

permissions:
  contents: write   # to commit the signal log back to the repo

concurrency:
  group: signal-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # latest commit, not the one at trigger time, so a queued run sees the last run's saved state

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}   # preferred: Resend doesn't filter alerts by content
          FORMSPREE_FORM: ${{ secrets.FORMSPREE_FORM }}   # fallback; its spam filter drops emails with prices
          ALERT_TO: ${{ secrets.ALERT_TO }}   # optional; falls back to alert_to in settings.toml
          MADEONSOL_API_KEY: ${{ secrets.MADEONSOL_API_KEY }}   # Strategy 2 + Solana bundle check
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}               # cluster, bundle, creator rug-pull checks
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          OKX_PROJECT_ID: ${{ secrets.OKX_PROJECT_ID }}         # only if OKX gave you one
          MODE: ${{ inputs.mode || 'run' }}
        run: |
          case "$MODE" in
            test-email) python bot.py --test-email ;;
            check-keys) python bot.py --check-keys ;;
            scorecard)  python bot.py --scorecard ;;
            dry-run)    python bot.py --dry-run ;;
            *)          python bot.py ;;
          esac

      - name: Save signal log
        if: always()
        run: |
          [ -d data ] || exit 0
          git config user.name "signal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "bot: log run $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push --quiet && exit 0
            sleep 5
          done
          exit 1
